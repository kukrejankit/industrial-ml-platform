<div class="login-page">
  <div class="login-card">

    <div class="login-brand">
      <div class="brand-icon">⚙</div>
      <div>
        <h1>Industrial ML</h1>
        <p>Asset Intelligence Platform</p>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tab-row">
      <button class="tab-btn" [class.active]="mode === 'login'"    (click)="switchMode('login')">Sign In</button>
      <button class="tab-btn" [class.active]="mode === 'register'" (click)="switchMode('register')">Register</button>
    </div>

    <!-- ── Login ── -->
    <div class="login-form" *ngIf="mode === 'login'">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="email" (keydown)="onKey($event)"
          placeholder="plant@company.com" class="form-input" [disabled]="loading" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" (keydown)="onKey($event)"
          placeholder="••••••••" class="form-input" [disabled]="loading" />
      </div>

      <div class="error-msg"   *ngIf="error">{{ error }}</div>
      <div class="success-msg" *ngIf="success">{{ success }}</div>

      <button class="login-btn" (click)="login()"
        [disabled]="!email.trim() || !password || loading">
        <span *ngIf="!loading">Sign In →</span>
        <span *ngIf="loading" class="spinner-wrap">
          <span class="btn-spinner"></span> Signing in…
        </span>
      </button>
    </div>

    <!-- ── Register ── -->
    <div class="login-form" *ngIf="mode === 'register'">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="regFullName" (keydown)="onKey($event)"
          placeholder="Jane Smith" class="form-input" [disabled]="loading" />
      </div>
      <div class="form-group">
        <label>Company / Plant Name</label>
        <input type="text" [(ngModel)]="regCompanyName" (keydown)="onKey($event)"
          placeholder="Plant Site 1" class="form-input" [disabled]="loading" />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="regEmail" (keydown)="onKey($event)"
          placeholder="plant@company.com" class="form-input" [disabled]="loading" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="regPassword" (keydown)="onKey($event)"
          placeholder="Min. 8 characters" class="form-input" [disabled]="loading" />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" [(ngModel)]="regConfirm" (keydown)="onKey($event)"
          placeholder="••••••••" class="form-input" [disabled]="loading" />
      </div>

      <div class="error-msg"   *ngIf="error">{{ error }}</div>
      <div class="success-msg" *ngIf="success">{{ success }}</div>

      <button class="login-btn" (click)="register()"
        [disabled]="!regFullName.trim() || !regCompanyName.trim() || !regEmail.trim() || !regPassword || !regConfirm || loading">
        <span *ngIf="!loading">Create Account →</span>
        <span *ngIf="loading" class="spinner-wrap">
          <span class="btn-spinner"></span> Creating account…
        </span>
      </button>
    </div>

    <div class="login-footer">
      Each plant site has its own login credentials.
    </div>
  </div>
</div>
