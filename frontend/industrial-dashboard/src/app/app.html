<nav *ngIf="showNav"
  style="padding:0 16px;background:#0c1e35;display:flex;align-items:center;gap:12px;height:48px;position:relative;z-index:9999;">

  <span style="color:#7dd3fc;font-size:18px;margin-right:4px;">⚙</span>
  <span style="color:white;font-size:13px;font-weight:700;margin-right:12px;letter-spacing:0.02em;">Industrial ML</span>

  <button (click)="navigate('/')"
    style="color:white;cursor:pointer;background:transparent;border:1px solid rgba(255,255,255,0.3);padding:5px 12px;border-radius:4px;font-size:13px;">
    Dashboard
  </button>
  <button (click)="navigate('/interview')"
    style="color:white;cursor:pointer;background:transparent;border:1px solid rgba(255,255,255,0.3);padding:5px 12px;border-radius:4px;font-size:13px;">
    Interview Tool
  </button>
  <button (click)="navigate('/data-collector')"
    style="color:white;cursor:pointer;background:transparent;border:1px solid rgba(255,255,255,0.3);padding:5px 12px;border-radius:4px;font-size:13px;">
    Data Collector
  </button>

  <div style="flex:1"></div>

  <span *ngIf="auth.currentUser()" style="color:#94a3b8;font-size:12px;">
    {{ auth.currentUser()?.email }}
  </span>

  <button (click)="logout()"
    style="color:#fca5a5;cursor:pointer;background:transparent;border:1px solid rgba(252,165,165,0.4);padding:5px 12px;border-radius:4px;font-size:13px;">
    Sign Out
  </button>
</nav>

<router-outlet></router-outlet>
